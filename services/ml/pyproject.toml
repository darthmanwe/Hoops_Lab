[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hoopslab"
version = "0.1.0"
description = "Cross-league basketball translation modelling for HoopsLab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kutlu Mizrak" }]
keywords = ["basketball", "nba", "euroleague", "sports-analytics", "hierarchical-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Dependencies are added in the phase that first uses them, with the reason for
# each bound stated. The previous version of this project declared httpx,
# pandas and pytest and imported none of them; an unused dependency is a
# maintenance liability and a misleading signal about what the code does.
dependencies = [
    # Bounded below 1.0 because typer is still pre-1.0 and has changed its
    # annotation handling across minors.
    "typer>=0.15,<1",
    "rich>=13,<15",
    # v1 and v2 are different libraries; everything here uses the v2 API.
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "pyyaml>=6,<7",
    # Transform and gold layers. Bounded below 2.0 because the lazy API is
    # expected to change there, and the gold build leans on it heavily.
    "polars>=1.20,<2",
    # Parquet IO. Major bumps have changed compression and statistics defaults,
    # which would silently invalidate the committed contract hashes.
    "pyarrow>=18,<26",
    # Only at the ingest boundary: nba_api and euroleague-api both hand back
    # pandas, and converting at the edge is cheaper than fighting them.
    "pandas>=2.1,<3",
    # Data contracts. Still pre-1.0 and the DataFrameModel API moves between
    # minors, so the range is deliberately narrow.
    "pandera>=0.32.1,<0.33",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
    # numpy 2 changed the C ABI that scipy, statsmodels and pyarrow compile
    # against; bounded below 3 because a major bump would invalidate the
    # committed model coefficients.
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    # The aging spline and the Heckman two-step. Bounded as insurance against a
    # formula-API change, which statsmodels has made before.
    "statsmodels>=0.14,<0.16",
    "scikit-learn>=1.4,<2",
    # The scouting-report layer. A runtime dependency rather than an extra
    # because the schemas, the groundedness harness and the committed response
    # cache are all part of the package's tested surface; only the calls that
    # would be billed are gated, and those are gated by a flag, not by an
    # import. Bounded below 1.0 because the SDK is pre-1.0 and
    # `messages.parse` is a beta-adjacent surface that has moved before.
    "anthropic>=0.69,<1",
]

[project.optional-dependencies]
# Ingestion is operator-only and never runs in CI: stats.nba.com refuses
# datacenter IPs, and GitHub Actions runners are hosted on Azure. None of this
# is needed to reproduce a reported result, because gold is committed.
#
# euroleague-api is GPLv3. Keeping it out of the runtime dependency set is what
# lets the distributed package stay MIT — the repository ships derived data,
# which is not a derivative work of that code.
ingest = [
    "nba_api>=1.4,<2",
    "euroleague-api>=0.1,<1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-PyYAML",
    "pandas-stubs",
]

[project.urls]
Homepage = "https://github.com/darthmanwe/Hoops_Lab"
Repository = "https://github.com/darthmanwe/Hoops_Lab"
Issues = "https://github.com/darthmanwe/Hoops_Lab/issues"

[project.scripts]
hoopslab = "hoopslab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hoopslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Safe and offline by default. Ingestion hits rate-limited public APIs and the
# scouting-report layer makes billed Anthropic calls, so spending money or
# depending on a third party has to be opted into explicitly. A bare `pytest`
# must be reproducible on a laptop with no network and no keys.
addopts = [
    "-m", "not (net or llm or judge or slow or repro)",
    "--strict-markers",
    "-ra",
]
markers = [
    "net: requires network access to a live data source",
    "llm: makes live, billed Anthropic API calls",
    "judge: runs the LLM-as-judge evaluation (billed)",
    "slow: long-running bootstrap or backtest",
    "repro: retrains models and asserts the committed metrics reproduce",
]

[tool.coverage.run]
source = ["src/hoopslab"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "ARG", "NPY", "PTH"]
ignore = [
    "E501",   # line length is the formatter's job
    "B008",   # typer relies on function calls in argument defaults
    "RUF012", # pydantic validates its own mutable defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
packages = ["hoopslab"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
disallow_untyped_defs = true
