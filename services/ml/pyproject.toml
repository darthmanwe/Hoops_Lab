[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hoopslab"
version = "0.1.0"
description = "Cross-league basketball translation modelling for HoopsLab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kutlu Mizrak" }]
keywords = ["basketball", "nba", "euroleague", "sports-analytics", "hierarchical-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Dependencies are added in the phase that first uses them, with the reason for
# each bound stated. The previous version of this project declared httpx,
# pandas and pytest and imported none of them; an unused dependency is a
# maintenance liability and a misleading signal about what the code does.
dependencies = [
    # Bounded below 1.0 because typer is still pre-1.0 and has changed its
    # annotation handling across minors.
    "typer>=0.15,<1",
    "rich>=13,<15",
    # v1 and v2 are different libraries; everything here uses the v2 API.
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/darthmanwe/Hoops_Lab"
Repository = "https://github.com/darthmanwe/Hoops_Lab"
Issues = "https://github.com/darthmanwe/Hoops_Lab/issues"

[project.scripts]
hoopslab = "hoopslab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hoopslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Safe and offline by default. Ingestion hits rate-limited public APIs and the
# scouting-report layer makes billed Anthropic calls, so spending money or
# depending on a third party has to be opted into explicitly. A bare `pytest`
# must be reproducible on a laptop with no network and no keys.
addopts = [
    "-m", "not (net or llm or judge or slow or repro)",
    "--strict-markers",
    "-ra",
]
markers = [
    "net: requires network access to a live data source",
    "llm: makes live, billed Anthropic API calls",
    "judge: runs the LLM-as-judge evaluation (billed)",
    "slow: long-running bootstrap or backtest",
    "repro: retrains models and asserts the committed metrics reproduce",
]

[tool.coverage.run]
source = ["src/hoopslab"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "ARG", "NPY", "PTH"]
ignore = [
    "E501",   # line length is the formatter's job
    "B008",   # typer relies on function calls in argument defaults
    "RUF012", # pydantic validates its own mutable defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
packages = ["hoopslab"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
disallow_untyped_defs = true
