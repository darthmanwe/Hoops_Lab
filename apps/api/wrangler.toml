name = "hoopslab-api"
main = "src/index.ts"
compatibility_date = "2026-02-25"

# Structured request logs are captured by Workers Logs, so there is no separate
# logging service to run or pay for.
[observability]
enabled = true

# Pin the local port, and pick an unusual one.
#
# Two separate problems, both seen on the machine this was developed on.
#
# Without an explicit port, wrangler silently moves to the next free one when
# its default is taken. The web app's API base is a constant, so the two drift
# apart and the browser fills with "Not Found" served by whatever unrelated
# process now answers there. Binding explicitly turns that into "address in
# use" at startup: a diagnosable error instead of a misleading page.
#
# 8787 is wrangler's default, which is exactly why it is not used here — every
# other Workers project on a developer's machine wants it too. 8710 is paired
# with the web app's 3710 so the two are obviously a set, and neither collides
# with the usual squatters (3000, 5173, 8000, 8080, 8787).
[dev]
port = 8710

# No bindings are declared at the top level, deliberately. Previously the
# production D1 and KV ids lived here, which meant `wrangler dev` and
# `wrangler deploy` both pointed at the production database. With bindings
# only under named environments, a bare `wrangler deploy` fails loudly instead
# of silently writing to production.

# --------------------------------------------------------------------------
# dev — local only. `wrangler dev --env dev` runs against a miniflare-managed
# SQLite file, so this id is never resolved remotely.
# --------------------------------------------------------------------------
[env.dev]
vars = { APP_ENV = "dev", DATA_SNAPSHOT = "" }

[[env.dev.d1_databases]]
binding = "DB"
database_name = "hoopslab-dev"
database_id = "00000000-0000-0000-0000-000000000000"

[[env.dev.kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"

# There is no staging environment, and this file used to imply one.
#
# `[env.staging]` sat here with an all-zero D1 id and an all-zero KV id, so
# `--env staging` did not fail because staging was unconfigured — it failed
# while looking configured, which is worse. Nothing deployed to it and no
# workflow referenced it. A second environment is worth having when there are
# pull-request previews to point at it; until then the honest shape of this
# project is one deployment, and saying so costs nothing.

# --------------------------------------------------------------------------
# production
#
# DATA_SNAPSHOT prefixes every cache key, so a re-seed with new data cannot
# serve stale entries: new data means a new snapshot id, which means the old
# keys are simply never asked for again. There is no purge API on the free
# plan and this is better than one anyway — the id is echoed in `meta.snapshot`
# and on `/health`, so a stale response identifies itself instead of having to
# be caught. It must be the id in the seed file that was actually loaded; the
# empty string that stood here before namespaced everything under a prefix
# that never changed, which is the failure this variable exists to prevent.
# --------------------------------------------------------------------------
[env.production]
vars = { APP_ENV = "production", DATA_SNAPSHOT = "ee6b530f0aa0" }

# A new database rather than the old one, which still holds February's schema:
# nba_gravity, game_momentum, team_fatigue_effect and the four hardcoded players.
# Migrations would have applied cleanly alongside them — the table names do not
# collide — but the result would be a production database containing tables named
# after the exact fabrications this rebuild exists to have deleted. hoopslab-db
# is left untouched rather than dropped; it costs nothing and it is the only
# remaining evidence of what the previous version actually served.
[[env.production.d1_databases]]
binding = "DB"
database_name = "hoopslab-prod"
database_id = "60c8efd8-4ba4-413f-b357-0746c902c0a8"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "932a10558aa04f7d96b218fe3d49de20"
